runtime: vllm

model:
  path: models/native-tool-model
  name: native-tool-model
  dtype: bfloat16
  trust_remote_code: true

gpu:
  device: 0
  memory_fraction: 0.85

context:
  max_context_tokens: 32768

generation:
  temperature: 0
  max_tokens: 4096
  top_p: 1.0
  enable_thinking: false

tool_agent:
  protocol: mistral
  max_model_turns: 40
  completion_runway_turns: 12
  progress_window_turns: 8
  max_total_tool_calls: 80
  max_tool_calls_per_turn: 8
  max_consecutive_tool_failures: 4
  max_single_tool_result_bytes: 65536
  max_total_tool_result_bytes: 524288
  context_safety_margin_tokens: 128
  minimum_output_tokens: 256
  context_recovery_target_tokens: 2048
  preserve_recent_tool_results: 8

workspace:
  checks:
    build:
      argv: ["make"]
      timeout_sec: 30
    test:
      argv: ["make", "test"]
      timeout_sec: 60

server:
  host: 127.0.0.1
  port: 31000
  startup_timeout_sec: 300
  python: python
  path_prefix:
  tool_call_parser: mistral
  enforce_eager: false

logging:
  path: experiments/logs
  format: jsonl
