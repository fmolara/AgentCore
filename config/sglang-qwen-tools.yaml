runtime: sglang

model:
  path: models/Qwen3.6-27B
  dtype: bfloat16
  trust_remote_code: true

gpu:
  device: 0
  memory_fraction: 0.80

context:
  max_context_tokens: 32768

generation:
  temperature: 0
  max_tokens: 4096
  top_p: 1.0
  enable_thinking: false

tool_agent:
  protocol: qwen
  max_model_turns: 40
  max_total_tool_calls: 80
  max_tool_calls_per_turn: 8
  max_consecutive_tool_failures: 4
  max_single_tool_result_bytes: 65536
  max_total_tool_result_bytes: 524288
  default_read_lines: 120
  max_read_lines: 500
  max_directory_depth: 4
  max_search_results: 100
  context_safety_margin_tokens: 128
  minimum_output_tokens: 256
  context_recovery_target_tokens: 2048
  preserve_recent_tool_results: 8
  max_edit_old_bytes: 65536
  max_edit_new_bytes: 65536
  max_write_file_bytes: 262144
  max_preview_bytes: 131072
  max_changed_lines: 1200
  max_rejected_side_effecting_calls: 5
  max_consecutive_rejected_side_effecting_calls: 5

workspace:
  checks:
    build:
      argv: ["make"]
      timeout_sec: 30
    test:
      argv: ["make", "test"]
      timeout_sec: 60

server:
  host: 127.0.0.1
  port: 31000
  startup_timeout_sec: 300
  python: python
  path_prefix:
  reasoning_parser: qwen3
  tool_call_parser: qwen3_coder
  log_level: info

logging:
  path: experiments/logs
  format: jsonl
  trace_path: experiments/logs/traces
  metrics_path: experiments/logs/daily-metrics.jsonl
