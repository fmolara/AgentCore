runtime: lmdeploy

model:
  path: models/Qwen3.6-27B
  name: qwen3.6-27b
  dtype: bfloat16
  trust_remote_code: true

gpu:
  device: 0

context:
  max_context_tokens: 4096

generation:
  temperature: 0
  max_tokens: 64
  top_p: 1.0
  enable_thinking: false

server:
  host: 127.0.0.1
  port: 32000
  startup_timeout_sec: 120
  executable: lmdeploy
  backend: turbomind
  model_format: hf
  max_batch_size: 1
  cache_max_entry_count: 0.2
  log_level: INFO
  max_log_len: 0

logging:
  path: experiments/logs
  format: jsonl
