[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a100-agent-lab"
version = "0.1.0"
description = "A100 coding-agent laboratory runtime platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch",
  "transformers",
  "PyYAML",
  "fastapi>=0.115,<0.116",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.28",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["a100_agent_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  ".",
  "packages/agentcore-protocol/src",
  "packages/agentclient/src",
]
markers = [
  "integration: opt-in tests that start real runtimes and may require GPU/model access",
]
