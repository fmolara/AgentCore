[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a100-agent-lab"
version = "0.1.0"
description = "A100 coding-agent laboratory runtime platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "torch",
  "transformers",
  "PyYAML",
]

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
where = ["."]
include = ["a100_agent_lab*"]
