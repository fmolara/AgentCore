[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentclient"
version = "0.1.0"
description = "Lightweight remote CLI for AgentCore servers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentcore-protocol>=1.0.0",
  "rich>=13",
]

[project.scripts]
agentclient = "agentclient.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
