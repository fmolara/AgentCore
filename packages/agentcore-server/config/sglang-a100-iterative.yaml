runtime: sglang

model:
  path: models/Qwen3.6-27B
  dtype: bfloat16
  trust_remote_code: true

gpu:
  device: 0
  memory_fraction: 0.80

context:
  max_context_tokens: 4096

generation:
  temperature: 0
  max_tokens: 64
  top_p: 1.0
  enable_thinking: false

planner:
  mode: iterative
  max_tokens: 1024
  temperature: 0
  context:
    safety_margin_tokens: 128
    output_tokens:
      exploration: 1024
      final_candidate: 1600
      format_recovery: 1600
      review: 768
      revision: 1600
      final_review: 768
    minimum_output_tokens:
      exploration: 384
      final_candidate: 1500
      format_recovery: 1500
      review: 384
      revision: 1500
      final_review: 384
    evidence:
      max_total_tokens: 1100
      max_tokens_per_file: 320
      max_files: 8
      context_lines: 2
    malformed_output:
      prefix_chars: 240
      suffix_chars: 240
  finalization:
    max_action_payload_bytes: 16384
    forbid_existing_file_write: false
  exploration:
    max_rounds: 3
    max_actions_per_round: 8
    max_total_actions: 20
    max_directory_depth: 4
    max_files_returned: 100
    max_search_files_scanned: 1000
    max_search_bytes: 4194304
    max_single_file_bytes: 65536
    max_total_observation_bytes: 262144
    max_observation_text_per_action: 65536

workspace:
  root: workspace
  checks:
    build:
      argv: ["make"]
      timeout_sec: 30
    test:
      argv: ["make", "test"]
      timeout_sec: 60

server:
  host: 127.0.0.1
  port: 31000
  startup_timeout_sec: 180
  python: python
  path_prefix:
  reasoning_parser: qwen3
  log_level: info

logging:
  path: experiments/logs
  format: jsonl
