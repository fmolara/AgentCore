[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcore-protocol"
version = "1.0.0"
description = "Shared AgentCore HTTP/SSE protocol and client library"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
